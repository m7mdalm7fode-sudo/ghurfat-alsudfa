services:
  - type: web
    name: ghurfat-alsudfa-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node authoritative_server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://m7mdalm7fode-sudo.github.io
      - key: NODE_VERSION
        value: "22"
